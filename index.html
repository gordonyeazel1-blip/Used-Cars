<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Used Car Buying Guide</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f0f;
    color: #e0d8c8;
    font-family: Georgia, serif;
    padding-bottom: 60px;
  }
  header {
    background: #1a1a10;
    border-bottom: 2px solid #c8a84b;
    padding: 24px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 99;
  }
  header .label { font-size: 11px; letter-spacing: 4px; color: #c8a84b; margin-bottom: 6px; text-transform: uppercase; }
  header h1 { font-size: clamp(20px, 5vw, 32px); font-weight: 400; color: #f0e8d8; }
  header .badges { display: flex; gap: 14px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  header .badge { background: #c8a84b22; border: 1px solid #c8a84b55; border-radius: 4px; padding: 4px 12px; font-size: 12px; color: #c8a84b; }

  .container { max-width: 780px; margin: 0 auto; padding: 20px 14px; }

  .section { margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 18px; cursor: pointer;
    background: #1c1c1c; border: 1px solid #333;
    border-radius: 8px;
    transition: background 0.2s;
    user-select: none;
  }
  .section-header.open { border-radius: 8px 8px 0 0; border-bottom: none; }
  .section-header:hover { background: #222; }
  .section-icon { font-size: 20px; }
  .section-title { font-weight: 600; font-size: 15px; color: #c8b890; flex: 1; }
  .section-header.open .section-title { color: #f0e8d8; }
  .section-count { font-size: 11px; color: #555; margin-top: 2px; }
  .chevron { color: #888; font-size: 16px; transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .items-list {
    display: none;
    background: #141414;
    border: 1px solid #333;
    border-top: none;
    border-radius: 0 0 8px 8px;
  }
  .items-list.open { display: block; }

  .item {
    padding: 13px 18px;
    border-bottom: 1px solid #222;
    cursor: pointer;
  }
  .item:last-child { border-bottom: none; }
  .item-row { display: flex; align-items: flex-start; gap: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .item-label { font-size: 14px; font-weight: 600; color: #ddd0b8; line-height: 1.4; flex: 1; }
  .item-arrow { color: #555; font-size: 11px; margin-top: 3px; flex-shrink: 0; }
  .item-detail {
    display: none;
    margin-top: 8px;
    margin-left: 17px;
    font-size: 13px;
    color: #999;
    line-height: 1.65;
    border-left: 2px solid #444;
    padding-left: 12px;
  }
  .item-detail.open { display: block; }

  .footer {
    margin-top: 28px;
    padding: 18px;
    background: #1a1506;
    border: 1px solid #c8a84b44;
    border-radius: 8px;
    font-size: 12px;
    color: #8a7a5a;
    line-height: 1.7;
    text-align: center;
  }
  .footer strong { color: #c8a84b; }
</style>
</head>
<body>
<header>
  <div class="label">Complete Reference Guide</div>
  <h1>Buying a Used Car</h1>
  <div class="badges">
    <span class="badge">11 Categories</span>
    <span class="badge">100+ Factors</span>
  </div>
</header>

<div class="container" id="guide"></div>

<script>
const sections = [
  {
    icon:"💰", title:"Budget & True Cost of Ownership", color:"#2a8a52",
    items:[
      ["Purchase price vs. total cost of ownership","Sticker price is only the beginning — factor in ALL costs below."],
      ["Sales tax","Varies by state. NC: 3% Highway Use Tax (capped at $2,000). FL: 6% + county surtax. Can be significant on a $15k+ vehicle."],
      ["Title & registration fees","Typically $100–$400 depending on state and vehicle weight/age."],
      ["Documentation (dealer) fees","NC dealers charge up to $599 doc fee by law. FL has no cap — some charge $1,000+. Always negotiate or ask to reduce."],
      ["Insurance costs BEFORE you buy","Call your insurer with the VIN. Older, higher-mileage cars can still be expensive to insure if the model has high theft/repair rates (e.g., Kia, Hyundai)."],
      ["Extended warranty / service contract","Factor in whether you want one. Third-party warranties (CARCHEX, Endurance, etc.) often better value than dealer F&I."],
      ["Immediate repair budget","Budget 5–10% of purchase price for immediate or near-term repairs on any used vehicle."],
      ["Fuel costs","MPG difference between vehicles adds up fast. A 10 MPG difference = ~$800–$1,200/year at current gas prices."],
    ]
  },
  {
    icon:"📋", title:"Vehicle History & Carfax/AutoCheck", color:"#2a5a8a",
    items:[
      ["Carfax vs. AutoCheck","Run BOTH — they source from different databases. A clean Carfax can still have issues on AutoCheck. AutoCheck often catches auction history Carfax misses."],
      ["Accident history","Look for number of incidents, severity (airbag deployment = major), and whether repairs were done at a certified shop."],
      ["Structural/frame damage","This is a deal-breaker for most buyers. Affects safety, resale, and alignment permanently. Walk away unless deeply discounted AND pre-inspected."],
      ["Number of previous owners","1–2 owners ideal. Fleet/rental use isn't automatically bad but means hard use. More owners = more unknown maintenance histories."],
      ["Title issues","Clean title is mandatory. Salvage, rebuilt, flood, lemon law buyback, or junk titles = significant risk and financing difficulty."],
      ["Odometer rollback flag","Carfax tracks reported mileage at each service/inspection. A declining or stagnant mileage pattern is a major red flag."],
      ["Service & maintenance records","Regular oil changes, timing belt/chain service, transmission service shown on the report = seller who cared for the vehicle."],
      ["Rental/fleet use","High-volume use but often well-maintained. Rental cars are typically serviced on strict schedules."],
      ["Open recalls","Check NHTSA.gov with the VIN. Unresolved recalls can be safety hazards and dealers must fix them free even on used vehicles."],
      ["Lien/loan on title","Ensure the seller has clear title or the lien is paid at closing. Private sellers: get lien release documentation."],
      ["Theft recovery","Some theft-recovery vehicles have hidden damage. Inspect carefully and discount heavily."],
    ]
  },
  {
    icon:"🛣️", title:"Mileage Considerations", color:"#6a3a9a",
    items:[
      ["Average mileage benchmark","~12,000–15,000 miles/year is considered average. A 2019 car should have ~60,000–75,000 miles. Lower = good; higher = price accordingly."],
      ["Highway vs. city miles","Highway miles are easier on engines than stop-and-go city miles. Ask or look at where the car was registered."],
      ["High mileage threshold: 100,000 miles","100k is psychological but not mechanical. Many modern vehicles (Toyota, Honda, Lexus) routinely run 200,000+ with proper maintenance."],
      ["Lexus RX 350 at 100k+","RX 350s are legendarily reliable. At 100k–150k they're often mid-life with proper care. Timing chain (not belt), bulletproof V6."],
      ["Mercedes C300 at 100k+","German luxury cars over 100k require scrutiny. European-brand parts and labor are 2–3x Japanese brands. Budget accordingly."],
      ["Mileage sweet spot for value","60,000–90,000 miles on a reliable make often gives best value: major depreciation done, but many miles remaining."],
      ["Low mileage ≠ low risk","A 10-year-old car with 30k miles may have dried-out rubber seals, degraded fluids, and rust from sitting. Infrequent driving is hard on cars."],
      ["Mileage and financing","Most lenders have hard cutoffs at 100k or 125k miles. Some won't finance above these thresholds — see Financing section."],
    ]
  },
  {
    icon:"🔧", title:"Pre-Purchase Inspection (PPI)", color:"#9a2a2a",
    items:[
      ["Always get a PPI — no exceptions","A $100–$200 independent inspection is the single best money you'll spend. Never skip this on a private sale."],
      ["Who to use","Use an independent mechanic — NOT a dealer-affiliated shop. Find a well-reviewed local shop on Google or Yelp. AAA-approved shops are reliable."],
      ["What a PPI covers","Engine compression, fluid conditions, brake thickness, tire depth, suspension/steering, AC/heat, electrical systems, rust inspection underneath, OBD scan for codes."],
      ["OBD-II diagnostic scan","Buy a $25 Bluetooth OBD-II scanner (Torque app) and check for pending/stored codes YOURSELF before a full PPI. Codes may be cleared but pending codes show."],
      ["Lift inspection","Insist on putting the car on a lift. Frame rust, undercarriage damage, leaks, and CV axle wear are invisible otherwise."],
      ["Compression test","Especially important for high-mileage vehicles. Low compression on any cylinder signals worn rings or valve problems — costly engine work ahead."],
      ["Fluid condition check","Brown/gritty ATF = neglected transmission. Milky oil = head gasket concern. Dark coolant = cooling system neglect."],
      ["Tire condition","Check tread depth with a quarter (Lincoln's head = less than 4/32\" — replace soon). Uneven wear = alignment/suspension issues."],
      ["Brake condition","Most shops measure pad thickness in mm. Under 3mm = replace soon. Scored or grooved rotors add cost."],
      ["AC system check","Critical in NC and Florida. Recharging is cheap; compressor replacement is $800–$1,500+. Verify it blows cold."],
      ["Body panel alignment","Uneven gaps between panels = prior collision repair. Use a paint thickness gauge (cheap on Amazon) to detect repainted panels over body filler."],
      ["Rust inspection","Check wheel wells, frame rails, subframe, floor pans, and rocker panels. Surface rust is cosmetic; structural rust is a deal-breaker."],
    ]
  },
  {
    icon:"🏦", title:"Financing: Rates, Terms & Lender Policies", color:"#2a6a6a",
    items:[
      ["Credit score impact on rate","750+: best rates (5–8% currently). 700–749: slightly higher. 650–699: subprime tier begins (10–15%+). Below 620: limited options, very high rates."],
      ["Pre-approval BEFORE shopping","Get pre-approved by your bank or credit union FIRST. This gives you a baseline rate and shopping power. Dealers can't play rate games if you walk in pre-approved."],
      ["Credit unions vs. banks","Credit unions (SECU in NC, Suncoast in FL, PenFed nationally) almost always beat big banks on used car rates by 1–3%."],
      ["Dealer financing (F&I)","Dealer arranges financing through lenders and marks up the rate. They may beat your pre-approval — let them try — but know your baseline."],
      ["Current rate environment (2025–2026)","Rates are elevated vs. 2020-2021. Expect 7–13% for good credit on a used vehicle. Shop aggressively. Every percentage point matters over 48–72 months."],
      ["36-month term","Best total interest cost. Payment will be highest. For cars under $15k, this is ideal if affordable."],
      ["48-month term","Good balance. Most lenders offer on vehicles up to 10–12 years old with reasonable mileage."],
      ["60-month term","Very common. Watch for older/high-mileage vehicles — lenders typically require 2017+ for 60 months as of 2026."],
      ["72-month term","Many lenders require vehicle within 5–6 model years AND under 100k miles for 72-month terms. Significantly more interest paid overall."],
      ["84-month term","Rare on used cars. Typically only offered on vehicles under 5 years old / low mileage. Very high total interest cost — avoid if possible."],
    ]
  },
  {
    icon:"⚠️", title:"Financing Cars Over 100,000 Miles: Lender Policies", color:"#9a5a1a",
    items:[
      ["SECU (NC State Employees CU)","Will finance older/higher-mileage vehicles but at shorter terms. Typically 36–48 months for 100k+ vehicles. Great rates for NC members. Call your branch directly."],
      ["PenFed Credit Union","Generally finances vehicles up to 10 model years old. High-mileage vehicles may require larger down payment. 48–60 months max depending on age/miles."],
      ["Navy Federal Credit Union","Somewhat flexible on older vehicles for members. May go to 60 months on vehicles in good condition even over 100k. Membership requires military/family connection."],
      ["Capital One Auto Finance","Will finance over 100k miles but often caps at 72 months for newer vehicles only. Older/high-mile = 48 months typical. Rate will be higher."],
      ["Bank of America Auto Loans","Generally won't finance vehicles over 10 model years old or over 125,000 miles. For 100k–125k range, expect 48 months max."],
      ["Wells Fargo Auto","Similar to BofA — stricter on age/mileage. Often caps at 125k miles. Terms shorten significantly for older vehicles."],
      ["Chase Auto Finance","Typically requires vehicle within 10 model years and under 120,000 miles. Not the most flexible for high-mileage buyers."],
      ["LightStream (Truist)","Offers unsecured personal auto loans — NO mileage or age restrictions. Requires excellent credit (720+). Terms 36–84 months. This is a top option for older vehicles."],
      ["Personal loan route (Upgrade, LendingClub)","If car is too old/high-mileage for auto lenders, a personal loan (unsecured) has no vehicle restrictions. Rates higher but complete flexibility."],
      ["USAA","Military members: will finance older vehicles. Generally more flexible than big banks. Call and describe the specific vehicle for a decision."],
      ["Local/community banks","Often the most flexible — can make case-by-case decisions. A solid relationship and 20%+ down payment can unlock terms big banks won't offer."],
      ["Buy Here Pay Here dealers","Last resort for poor credit. Very high rates (18–29%), short terms, GPS-tracked vehicles. Only if no alternatives exist."],
      ["Down payment strategy","20%+ down significantly improves lender willingness on high-mileage/older vehicles. Reduces their risk and your monthly payment simultaneously."],
      ["LTV (Loan-to-Value) ratio","Lenders use NADA/KBB book value, not your purchase price. If you overpay for a high-mileage car, lender may only finance 80–100% of book value."],
    ]
  },
  {
    icon:"⚙️", title:"Mechanical Reliability Research", color:"#3a6a2a",
    items:[
      ["Consumer Reports reliability data","The gold standard. Subscribers see model-year-specific reliability scores across 17+ problem areas. $49/year — worth it when buying a car."],
      ["J.D. Power dependability studies","Measures 3-year-old vehicle quality. Good for understanding how a specific model ages."],
      ["Owner forums","Model-specific forums (ClubLexus, BimmerFest, Bob Is The Oil Guy) reveal real-world issues surveys don't capture. Search '[model year] common problems'."],
      ["Known model-specific issues","Examples: Toyota/Lexus 2GR-FE V6 oil consumption (2007–2013 RX 350 included — check consumption). BMW timing chain rattle. Mercedes ABC suspension costs."],
      ["Timing belt vs. timing chain","Belt = requires replacement every 60–90k miles (~$800–$1,500). Chain = theoretically lifetime but can stretch. Know which your target vehicle has."],
      ["Transmission type reliability","Traditional automatic = most reliable. CVT = can fail expensively (Nissan notorious). Dual-clutch DCT = can be jerky with expensive service."],
      ["Rust-prone models/regions","Rust-belt state vehicles are risky. VIN decode tells you state of original sale. NC and FL vehicles generally have better rust profiles."],
      ["Parts availability and cost","Japanese brands: cheap, widely available. German luxury: 2–4x more expensive. Check RockAuto before buying any used vehicle."],
    ]
  },
  {
    icon:"🤝", title:"Price Research & Negotiation", color:"#2a3a7a",
    items:[
      ["KBB (Kelley Blue Book)","Good starting point. Use 'Fair Purchase Price' not 'Retail Value.' KBB tends to skew high for dealer benefit."],
      ["NADA Guides","Banks and lenders use NADA for loan approvals. Get NADA value to know what a lender will finance."],
      ["Edmunds True Market Value","Often the most accurate real-world transaction price. Use Edmunds as your primary pricing reference."],
      ["CarGurus & CarMax pricing","CarGurus shows how a listing compares to market (Good/Fair/High Deal). Excellent for benchmarking dealer listings."],
      ["Private sale vs. dealer","Private sales: typically 10–20% below dealer but no warranty, harder financing, more risk. Dealers: convenience, CPO options, financing, but higher price."],
      ["Negotiating tactics","Start 10–15% below asking. Reference competing listings. Use PPI findings as leverage. Don't show emotional attachment. Be willing to walk."],
      ["Add-ons to avoid","GAP insurance from dealer (buy from your insurer — cheaper), paint/fabric protection ($200+ pure profit, worthless), nitrogen tires (free at any tire shop)."],
      ["When to BUY GAP insurance","DO buy GAP if financing more than 80% of vehicle value. Covers the difference if car is totaled and you owe more than it's worth."],
      ["Out-the-door (OTD) price","Always negotiate the OTD price — the final number including ALL fees, taxes, and add-ons. Never let dealers break it into monthly payment components."],
    ]
  },
  {
    icon:"🚗", title:"Test Drive Checklist", color:"#5a2a6a",
    items:[
      ["Cold start","Start the car before it's warmed up. Rough idle, smoke, or unusual noises on cold start reveal problems a warmed engine hides."],
      ["Highway speeds","Get it to 65–70 mph. Vibrations, pulling, or wandering at speed = wheel balance, alignment, or tire issues."],
      ["Hard acceleration","Full throttle briefly. Hesitation, stumbling, or transmission slipping under load is very telling."],
      ["Hard braking test","In a safe area, brake hard from 40 mph. Pulling to one side = brake issues. Pulsating pedal = warped rotors."],
      ["All electronics","Every window, mirror, seat adjustment, sunroof, infotainment, backup camera, parking sensors, heated seats — test everything. Repairs are expensive."],
      ["AC and heat","Run full cold and full hot. AC should reach 45°F or below at the vent within a few minutes."],
      ["Steering feel","Loose, wandering, or pulling = alignment, tie rod, or rack issues. Vibration in wheel = tire balance or wheel bearing."],
      ["Transmission shifts","Automatics should shift smoothly and promptly. Hesitation, hard shifts, or slipping is a major red flag."],
      ["Smell inside and out","Mold/mildew = flood damage or persistent leak. Burning smell = electrical or oil leak. Smoke = serious engine issue."],
    ]
  },
  {
    icon:"📄", title:"Paperwork & Legal Considerations", color:"#4a4a1a",
    items:[
      ["Title in seller's name","NEVER buy a car where the title is in a third party's name unless you fully understand why. Huge fraud risk."],
      ["Bill of Sale","Always get a signed bill of sale with date, price, VIN, both parties' names/addresses, and 'as-is' language clearly stated."],
      ["'As-Is' acknowledgment","Most used car sales are as-is. Know what you're agreeing to. This is why PPI is essential."],
      ["Odometer disclosure statement","Federal law requires sellers to provide this for vehicles under 10 years old. A dealer skipping this is a red flag."],
      ["Emissions/inspection status","NC requires annual safety inspection. Know when the current inspection expires."],
      ["Certified Pre-Owned (CPO)","Manufacturer-backed CPO is the best used car value for recent-model vehicles. Rigorous inspection + extended warranty backed by the manufacturer."],
      ["Private sale payment","Cash or cashier's check for private sales. NEVER wire transfer or Venmo/Zelle to a stranger. Meet at your bank to verify cashier's checks."],
      ["Dealer return policy","Some dealers offer 3–7 day return windows. Ask specifically. CarMax has a 30-day return policy — a significant advantage."],
    ]
  },
  {
    icon:"📅", title:"Timing & Market Strategy", color:"#2a6a4a",
    items:[
      ["Best time to buy: end of month/quarter","Dealers have sales quotas. Last few days of month = salespeople most motivated to deal. End of quarter (March, June, Sept, Dec) even better."],
      ["Best time to buy: model year changeover","August–October: previous year models sit on lots. Less relevant for used but affects dealer mindset and pricing flexibility."],
      ["Used car market 2025–2026","Post-COVID prices have softened from 2021–2022 peaks but remain elevated. Used inventory is recovering. Buyers have more leverage than 2–3 years ago."],
      ["Weather & demand seasonality","Convertibles/sports cars: buy in winter (low demand). SUVs/4WD: buy in summer in the South. Trucks: always high demand in NC/SC."],
      ["Don't rush","The car you love will come around again. Rushing a purchase is how you overpay and overlook red flags. Give yourself 30–60 days to shop properly."],
    ]
  },
];

const guide = document.getElementById('guide');
let totalItems = sections.reduce((s,x) => s + x.items.length, 0);
document.querySelector('.badges').innerHTML = `<span class="badge">11 Categories</span><span class="badge">${totalItems} Factors</span>`;

sections.forEach((sec, si) => {
  const div = document.createElement('div');
  div.className = 'section';

  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = `
    <span class="section-icon">${sec.icon}</span>
    <div style="flex:1">
      <div class="section-title">${sec.title}</div>
      <div class="section-count">${sec.items.length} factors</div>
    </div>
    <span class="chevron">▾</span>
  `;

  const list = document.createElement('div');
  list.className = 'items-list';

  sec.items.forEach(([label, detail], ii) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div class="item-row">
        <div class="dot" style="background:${sec.color}"></div>
        <div style="flex:1">
          <div class="item-label">${label}</div>
          <div class="item-detail">${detail}</div>
        </div>
        <div class="item-arrow">▾</div>
      </div>
    `;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const d = item.querySelector('.item-detail');
      const a = item.querySelector('.item-arrow');
      const open = d.classList.toggle('open');
      a.textContent = open ? '▴' : '▾';
      item.style.background = open ? sec.color + '18' : '';
    });
    list.appendChild(item);
  });

  hdr.addEventListener('click', () => {
    const open = list.classList.toggle('open');
    hdr.classList.toggle('open', open);
    hdr.querySelector('.chevron').classList.toggle('open', open);
    if (open) hdr.style.background = `linear-gradient(135deg, ${sec.color}33, ${sec.color}18)`;
    else hdr.style.background = '';
    if (open) hdr.style.borderColor = sec.color + '66';
    else hdr.style.borderColor = '#333';
  });

  div.appendChild(hdr);
  div.appendChild(list);
  guide.appendChild(div);
});

const footer = document.createElement('div');
footer.className = 'footer';
footer.innerHTML = '<strong>Tip:</strong> Tap any category to expand, then tap individual factors for details.<br>Lender policies change — always call your specific lender for current mileage/age cutoffs and term options.';
guide.appendChild(footer);
</script>
</body>
</html>
